plugins { id 'com.android.application' }

android {
    namespace 'com.parkjuyong.rebarcalc'
    compileSdk 36

    defaultConfig {
        applicationId 'com.parkjuyong.rebarcalc'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
